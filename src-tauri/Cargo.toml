[package]
name = "klikreel"
version = "0.1.6"
description = "Turn a prompt and your codebase into a narrated product promo video"
authors = ["Adam Suchi Hafizullah"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ashafizullah/klikreel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klikreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
dirs = "7.0.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "multipart"] }
chromiumoxide = "0.9.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ignore = "0.4.33"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
moxcms = "0.9.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
